<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="bronzeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE9B83"/>
      <stop offset="35%" stop-color="#8B6D5A"/>
      <stop offset="70%" stop-color="#5E493E"/>
      <stop offset="100%" stop-color="#3B312B"/>
    </linearGradient>
    <radialGradient id="chronoCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE57F"/>
      <stop offset="55%" stop-color="#FFAA00"/>
      <stop offset="85%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#121417"/>
    </radialGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#8C2200"/>
    </linearGradient>
  </defs>

  <!-- Outer Cast Iron Bezel with Rivets -->
  <circle cx="128" cy="128" r="120" fill="#181B20" stroke="url(#bronzeRim)" stroke-width="8"/>
  <circle cx="128" cy="128" r="110" fill="#121417" stroke="#282D35" stroke-width="2"/>

  <!-- 12 Clockwork Gear Teeth Rivets -->
  <g fill="#FFAA00" stroke="#3B312B" stroke-width="1">
    <circle cx="128" cy="14" r="5"/>
    <circle cx="185" cy="29" r="5"/>
    <circle cx="227" cy="71" r="5"/>
    <circle cx="242" cy="128" r="5"/>
    <circle cx="227" cy="185" r="5"/>
    <circle cx="185" cy="227" r="5"/>
    <circle cx="128" cy="242" r="5"/>
    <circle cx="71" cy="227" r="5"/>
    <circle cx="29" cy="185" r="5"/>
    <circle cx="14" cy="128" r="5"/>
    <circle cx="29" cy="71" r="5"/>
    <circle cx="71" cy="29" r="5"/>
  </g>

  <!-- 4 Biological Life Stage Quadrants (Youth, Prime, Elder, Ascendant) -->
  <!-- Quadrant 1: Youth (20-34, Top-Right) -->
  <path d="M 128 128 L 128 26 A 102 102 0 0 1 230 128 Z" fill="#282D35" fill-opacity="0.5" stroke="#FFAA00" stroke-width="2"/>
  <text x="160" y="80" fill="#FFE57F" font-family="monospace" font-size="12" font-weight="bold">YOUTH</text>
  <text x="160" y="95" fill="#8B6D5A" font-family="monospace" font-size="9">20-34</text>

  <!-- Quadrant 2: Prime (35-54, Bottom-Right) -->
  <path d="M 128 128 L 230 128 A 102 102 0 0 1 128 230 Z" fill="#22272E" fill-opacity="0.6" stroke="#8B6D5A" stroke-width="1.5"/>
  <text x="160" y="165" fill="#BE9B83" font-family="monospace" font-size="12" font-weight="bold">PRIME</text>
  <text x="160" y="180" fill="#8B6D5A" font-family="monospace" font-size="9">35-54</text>

  <!-- Quadrant 3: Elder (55-74, Bottom-Left) -->
  <path d="M 128 128 L 128 230 A 102 102 0 0 1 26 128 Z" fill="#181B20" fill-opacity="0.7" stroke="#4A607A" stroke-width="1.5"/>
  <text x="65" y="165" fill="#627D9E" font-family="monospace" font-size="12" font-weight="bold">ELDER</text>
  <text x="65" y="180" fill="#3A4B5F" font-family="monospace" font-size="9">55-74</text>

  <!-- Quadrant 4: Ascendant (75-80, Top-Left) -->
  <path d="M 128 128 L 26 128 A 102 102 0 0 1 128 26 Z" fill="#121417" fill-opacity="0.8" stroke="#FF6600" stroke-width="2"/>
  <text x="50" y="80" fill="#FF8800" font-family="monospace" font-size="11" font-weight="bold">ASCENDANT</text>
  <text x="65" y="95" fill="#C43B00" font-family="monospace" font-size="9">75-80</text>

  <!-- Dial Ticks (Every 5 years) -->
  <g stroke="#BE9B83" stroke-width="2">
    <line x1="128" y1="26" x2="128" y2="38"/>
    <line x1="230" y1="128" x2="218" y2="128"/>
    <line x1="128" y1="230" x2="128" y2="218"/>
    <line x1="26" y1="128" x2="38" y2="128"/>
    <line x1="200" y1="56" x2="191" y2="65"/>
    <line x1="200" y1="200" x2="191" y2="191"/>
    <line x1="56" y1="200" x2="65" y2="191"/>
    <line x1="56" y1="56" x2="65" y2="65"/>
  </g>

  <!-- Central Temporal Energy Core -->
  <circle cx="128" cy="128" r="42" fill="url(#chronoCore)"/>
  <circle cx="128" cy="128" r="32" fill="#121417" stroke="#FFAA00" stroke-width="2"/>

  <!-- Chrono-Pointer Needle (Currently pointing in Youth sector) -->
  <polygon points="124,128 132,128 130,42 128,32 126,42" fill="url(#needleGrad)" stroke="#121417" stroke-width="1.5" transform="rotate(35 128 128)"/>
  
  <!-- Central Brass Hub -->
  <circle cx="128" cy="128" r="14" fill="#FFAA00" stroke="#3B312B" stroke-width="2"/>
  <circle cx="128" cy="128" r="6" fill="#121417"/>
</svg>
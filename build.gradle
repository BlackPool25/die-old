buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    }
    dependencies {
        classpath 'com.badlogicgames.gdx:gdx-tools:1.13.1'
    }
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    ext {
        appName = "Die Old"
        gdxVersion = '1.13.1'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        junitVersion = '5.10.2'
    }

    repositories {
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    }
}

project(":core") {
    apply plugin: "java-library"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        api "com.badlogicgames.box2dlights:box2dlights:$box2DLightsVersion"
        api "com.badlogicgames.ashley:ashley:$ashleyVersion"

        testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        testImplementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }
}

project(":desktop") {
    apply plugin: "java"
    apply plugin: "application"

    mainClassName = "com.dieold.game.desktop.DesktopLauncher"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }

    run {
        workingDir = rootProject.projectDir
        ignoreExitValue = true
    }
}

tasks.register('packTextures', JavaExec) {
    classpath = project(':core').sourceSets.main.runtimeClasspath
    mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
    args = [
        project.hasProperty('inputDir') ? project.property('inputDir') : 'assets_raw',
        project.hasProperty('outputDir') ? project.property('outputDir') : 'assets/atlases',
        project.hasProperty('packName') ? project.property('packName') : 'game'
    ]
}

tasks.register('packAllAtlases') {
    doLast {
        def settings = new com.badlogic.gdx.tools.texturepacker.TexturePacker.Settings()
        settings.pot = true
        settings.fast = false
        settings.combineSubdirectories = false
        settings.paddingX = 2
        settings.paddingY = 2
        settings.duplicatePadding = true
        settings.bleed = true

        File outDir = file('assets/atlases')
        outDir.mkdirs()

        // 1. Pack characters
        File charDir = file('assets/sprites_raw/characters')
        if (charDir.exists()) {
            println "Packing characters from ${charDir.absolutePath}..."
            com.badlogic.gdx.tools.texturepacker.TexturePacker.process(settings, charDir.absolutePath, outDir.absolutePath, 'characters')
        }
    }
}

